{% extends "base.html" %}

{% block title %}归档 - {{ site_name }}{% endblock %}

{% block content %}
<h1 class="page-title">文章归档</h1>
<section class="archive-list">
  {% for post in posts %}
  <div class="archive-item">
    <time>{{ post.date }}</time>
    <a href="{{ url_for('post_detail', slug=post.slug) }}">{{ post.title }}</a>
  </div>
  {% endfor %}
</section>
{% endblock %}
