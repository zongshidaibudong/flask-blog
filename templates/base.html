<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 静态托管拿不到 HTTP 响应头，这里用 meta 补一道 CSP；
       frame-ancestors 在 meta 里不生效，故只在 Flask 侧的那份头里给。 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'none'; object-src 'none'; base-uri 'self'">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>

  <meta name="description" content="{% block description %}{{ site_description }}{% endblock %}">
  <meta name="author" content="代凯文">

  <!-- 图标：现代浏览器读 SVG，旧浏览器与 iOS 读 PNG -->
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/favicon.svg') }}">
  <link rel="alternate icon" type="image/png" href="{{ url_for('static', filename='assets/favicon.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='assets/apple-touch-icon.png') }}">

  <!-- 分享预览（Open Graph / Twitter Card），og:image 必须是绝对地址 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ self.description() }}{% endblock %}">
  <meta property="og:url" content="{{ site_url }}{{ request.path }}">
  <meta property="og:image" content="{{ site_url }}{{ url_for('static', filename='assets/og-cover.png') }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ self.og_title() }}">
  <meta name="twitter:description" content="{{ self.og_description() }}">
  <meta name="twitter:image" content="{{ site_url }}{{ url_for('static', filename='assets/og-cover.png') }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="{{ url_for('index') }}" class="site-title">
        <img src="{{ url_for('static', filename='assets/logo.svg') }}" alt="Logo" class="site-logo">
        <span>{{ site_name }}</span>
      </a>
      <nav class="site-nav">
        <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>首页</a>
        <a href="{{ url_for('archive') }}" {% if request.endpoint == 'archive' %}class="active"{% endif %}>归档</a>
        <a href="{{ url_for('about') }}" {% if request.endpoint == 'about' %}class="active"{% endif %}>关于</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="title-block">
        <div><span class="label">设计 DESIGN</span>代凯文</div>
        <div><span class="label">比例 SCALE</span>1 : 1</div>
        <div><span class="label">图号 DWG NO.</span>DKW-BLOG-001</div>
        <div><span class="label">日期 DATE</span>{{ current_year }}</div>
      </div>
      <p class="footer-note">POWERED BY FLASK · 机械工程师的数字图板</p>
    </div>
  </footer>
</body>
</html>
