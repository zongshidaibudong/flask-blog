{% extends "base.html" %}

{% block title %}标签「{{ tag }}」 - {{ site_name }}{% endblock %}

{% block content %}
<h1 class="page-title">标签：{{ tag }}</h1>
<section class="post-list">
  {% for post in posts %}
  <article class="post-card">
    <h2><a href="{{ url_for('post_detail', slug=post.slug) }}">{{ post.title }}</a></h2>
    <div class="post-meta">
      <time>{{ post.date }}</time>
    </div>
    <p class="post-summary">{{ post.summary }}</p>
  </article>
  {% else %}
  <p class="empty">该标签下暂无文章。</p>
  {% endfor %}
</section>
{% endblock %}
