<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 图板外框 -->
  <rect x="5" y="5" width="190" height="190" fill="white" stroke="#1e3a8a" stroke-width="3" rx="4"/>
  <!-- 网格线 -->
  <g stroke="#1e40af" stroke-width="0.5" opacity="0.12">
    <line x1="5" y1="43" x2="195" y2="43"/><line x1="5" y1="81" x2="195" y2="81"/>
    <line x1="5" y1="119" x2="195" y2="119"/><line x1="5" y1="157" x2="195" y2="157"/>
    <line x1="43" y1="5" x2="43" y2="195"/><line x1="81" y1="5" x2="81" y2="195"/>
    <line x1="119" y1="5" x2="119" y2="195"/><line x1="157" y1="5" x2="157" y2="195"/>
  </g>
  <!-- 四角工程标注 -->
  <g stroke="#ea580c" stroke-width="2.5" fill="none">
    <path d="M 5,25 L 5,5 L 25,5"/><path d="M 175,5 L 195,5 L 195,25"/>
    <path d="M 195,175 L 195,195 L 175,195"/><path d="M 25,195 L 5,195 L 5,175"/>
  </g>
  <!-- 齿轮 -->
  <g transform="translate(100,100)">
    <g fill="#1e40af">
      <rect x="-7" y="-70" width="14" height="18" rx="2"/>
      <rect x="-7" y="52" width="14" height="18" rx="2"/>
      <rect x="-70" y="-7" width="18" height="14" rx="2"/>
      <rect x="52" y="-7" width="18" height="14" rx="2"/>
      <g transform="rotate(45)">
        <rect x="-7" y="-70" width="14" height="18" rx="2"/>
        <rect x="-7" y="52" width="14" height="18" rx="2"/>
        <rect x="-70" y="-7" width="18" height="14" rx="2"/>
        <rect x="52" y="-7" width="18" height="14" rx="2"/>
      </g>
    </g>
    <circle r="52" fill="#1e40af"/><circle r="44" fill="white"/>
    <circle r="42" fill="none" stroke="#1e40af" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- 中心笔尖 -->
    <path d="M 0,-32 L 5,0 L -5,0 Z" fill="#ea580c"/>
    <circle r="6" fill="#1e40af"/><circle r="2.5" fill="white"/>
  </g>
</svg>
