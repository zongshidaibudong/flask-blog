<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <pattern id="gridFine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#3b82f6" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  <!-- 蓝图背景 -->
  <rect width="1200" height="300" fill="#1e3a8a"/>
  <rect width="1200" height="300" fill="url(#gridFine)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- 左侧制图工具组 -->
  <g stroke="#93c5fd" stroke-width="1.5" fill="none" opacity="0.7">
    <!-- 直尺 -->
    <rect x="50" y="40" width="180" height="28" rx="2"/>
    <g stroke-width="1" stroke="#bfdbfe">
      <line x1="70" y1="40" x2="70" y2="54"/><line x1="90" y1="40" x2="90" y2="50"/>
      <line x1="110" y1="40" x2="110" y2="54"/><line x1="130" y1="40" x2="130" y2="50"/>
      <line x1="150" y1="40" x2="150" y2="54"/><line x1="170" y1="40" x2="170" y2="50"/>
      <line x1="190" y1="40" x2="190" y2="54"/><line x1="210" y1="40" x2="210" y2="50"/>
    </g>
  </g>

  <!-- 三角板 -->
  <g stroke="#93c5fd" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 40,280 L 150,280 L 40,170 Z"/>
    <line x1="50" y1="270" x2="50" y2="180"/>
    <path d="M 40,170 L 55,185" stroke-width="1"/>
  </g>

  <!-- 圆规 -->
  <g transform="translate(300,120)" stroke="#93c5fd" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M 0,0 L -55,110"/>
    <path d="M 0,0 L 55,110"/>
    <circle cx="0" cy="0" r="7"/>
    <path d="M -10,-18 L 10,-18 L 0,0 Z" fill="#93c5fd"/>
    <circle cx="-55" cy="110" r="3" fill="#93c5fd"/>
    <circle cx="55" cy="110" r="3" fill="#93c5fd"/>
  </g>

  <!-- 中部齿轮 -->
  <g transform="translate(500,200)" stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.35">
    <circle r="70"/>
    <circle r="55"/>
    <circle r="12" fill="#60a5fa" opacity="0.5"/>
    <g fill="#60a5fa" opacity="0.5">
      <rect x="-5" y="-85" width="10" height="14" rx="1"/>
      <rect x="-5" y="71" width="10" height="14" rx="1"/>
      <rect x="-85" y="-5" width="14" height="10" rx="1"/>
      <rect x="71" y="-5" width="14" height="10" rx="1"/>
      <g transform="rotate(45)">
        <rect x="-5" y="-85" width="10" height="14" rx="1"/>
        <rect x="-5" y="71" width="10" height="14" rx="1"/>
        <rect x="-85" y="-5" width="14" height="10" rx="1"/>
        <rect x="71" y="-5" width="14" height="10" rx="1"/>
      </g>
    </g>
  </g>

  <!-- 右侧技术标注线 -->
  <g stroke="#93c5fd" stroke-width="1" opacity="0.4">
    <line x1="750" y1="70" x2="950" y2="70"/>
    <line x1="750" y1="62" x2="750" y2="78"/>
    <line x1="950" y1="62" x2="950" y2="78"/>
    <line x1="850" y1="110" x2="850" y2="240"/>
    <line x1="842" y1="110" x2="858" y2="110"/>
    <line x1="842" y1="240" x2="858" y2="240"/>
    <line x1="700" y1="150" x2="900" y2="250" stroke-dasharray="5,3"/>
  </g>

  <!-- 右侧大齿轮装饰 -->
  <g transform="translate(1050,150)" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.25">
    <circle r="90"/><circle r="72"/><circle r="18"/>
    <g>
      <rect x="-6" y="-108" width="12" height="18" rx="1"/>
      <rect x="-6" y="90" width="12" height="18" rx="1"/>
      <rect x="-108" y="-6" width="18" height="12" rx="1"/>
      <rect x="90" y="-6" width="18" height="12" rx="1"/>
      <g transform="rotate(45)">
        <rect x="-6" y="-108" width="12" height="18" rx="1"/>
        <rect x="-6" y="90" width="12" height="18" rx="1"/>
        <rect x="-108" y="-6" width="18" height="12" rx="1"/>
        <rect x="90" y="-6" width="18" height="12" rx="1"/>
      </g>
    </g>
  </g>

</svg>
